<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 5 petals fanning out from center, each rotated 72° -->
  <g transform="translate(50 50)" fill="#E8909B">
    <ellipse cx="0" cy="-25" rx="14" ry="20" />
    <ellipse cx="0" cy="-25" rx="14" ry="20" transform="rotate(72)" />
    <ellipse cx="0" cy="-25" rx="14" ry="20" transform="rotate(144)" />
    <ellipse cx="0" cy="-25" rx="14" ry="20" transform="rotate(216)" />
    <ellipse cx="0" cy="-25" rx="14" ry="20" transform="rotate(288)" />
  </g>
  <!-- darker center -->
  <circle cx="50" cy="50" r="8" fill="#B4636E" />
  <!-- subtle highlights on each petal -->
  <g transform="translate(50 50)" fill="#F2B5BD" opacity="0.6">
    <ellipse cx="-3" cy="-30" rx="3" ry="6" />
    <ellipse cx="-3" cy="-30" rx="3" ry="6" transform="rotate(72)" />
    <ellipse cx="-3" cy="-30" rx="3" ry="6" transform="rotate(144)" />
    <ellipse cx="-3" cy="-30" rx="3" ry="6" transform="rotate(216)" />
    <ellipse cx="-3" cy="-30" rx="3" ry="6" transform="rotate(288)" />
  </g>
</svg>
